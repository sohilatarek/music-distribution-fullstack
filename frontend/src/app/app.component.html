<div class="app">
  <header class="app-header">
    <a routerLink="/" class="app-title">🎵 Music Distribution — Track Manager</a>

    <div class="session" *ngIf="auth.isAuthenticated()">
      <span class="badge badge-live">Signed in</span>
      <button type="button" class="btn-ghost" (click)="logout()">Log out</button>
    </div>

    <form class="login-bar" *ngIf="!auth.isAuthenticated()" (ngSubmit)="login()">
      <div class="field">
        <label for="username">Username</label>
        <input
          id="username"
          name="username"
          autocomplete="username"
          placeholder="admin"
          [ngModel]="username()"
          (ngModelChange)="username.set($event)"
        />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          placeholder="••••••••"
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
        />
      </div>
      <button type="submit" [disabled]="submitting() || !password()">
        {{ submitting() ? 'Signing in…' : 'Log in' }}
      </button>
      <span class="login-error" *ngIf="loginError()" role="alert">{{ loginError() }}</span>
    </form>
  </header>

  <main class="app-main">
    <router-outlet></router-outlet>
  </main>
</div>
